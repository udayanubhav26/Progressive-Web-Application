<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - BuzzBuy</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

<!-- NAVBAR -->
<header>
    <nav class="navbar flex container">

        <a href="index.html" class="logo">Buzz<span>Buy.</span></a>

        <ul class="navlist flex">

            <li><a href="index.html" class="link">HOME</a></li>
            <li><a href="shop.html" class="link">SHOP</a></li>
            <li><a href="blog.html" class="link">BLOG</a></li>
            <li><a href="contact.html" class="link active">CONTACT</a></li>

            <li class="nav-icons flex">

                <a href="#" class="icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>

                <a href="#" class="icon">
                    <i class="fa-solid fa-user"></i>
                </a>

                <a href="cart.html" class="icon icon-active cart-icon">
                    <i class="fa-solid fa-shopping-bag"></i>
                    <span id="cart-count">0</span>
                </a>

            </li>

        </ul>

        <a href="#" class="hamburger">
            <i class="fa-solid fa-bars"></i>
        </a>

    </nav>
    <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="Search products...">
</div>
</header>

<!-- CONTACT SECTION -->
<section class="section container" style="margin-top: 50px">

<h2>Contact Us</h2>
<div class="line"></div>

<div class="contact-wrapper">

    <!-- FORM -->
    <form class="contact-form">

        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <input type="text" placeholder="Subject">

        <textarea rows="6" placeholder="Your Message"></textarea>

        <button type="submit">Send Message</button>

    </form>

    <!-- INFO -->
    <div class="contact-info">
        <h3>Get in Touch</h3>
        <p><i class="fa-solid fa-location-dot"></i> Chhindwara City, India</p>
        <p><i class="fa-solid fa-phone"></i> +91 9302158097</p>
        <p><i class="fa-solid fa-envelope"></i> buzzbuy@gmail.com</p>

        <div class="social">
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-twitter"></i>
        </div>
    </div>

</div>

</section>

</body>
</html>
